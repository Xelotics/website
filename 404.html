<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Xelotics Games</title>
    <!-- Dynamic Favicon -->
    <link id="favicon" rel="icon" type="image/png" href="favicon-dark.png">
    <!-- Google Fonts for Rubik and Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #a855f7;
            --box-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --accent-color: #7c3aed;
            --box-bg: rgba(0, 0, 0, 0.03);
            --border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #a855f7;
            --box-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .error-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 50px 40px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-sizing: border-box;
        }

        .btn {
            background: var(--accent-color);
            border: none;
            color: #ffffff;
            padding: 14px 28px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="error-container">
        <h1 style="margin: 0; color: var(--accent-color); font-size: 3.2rem;">404</h1>
        <h2 style="margin: 0; font-size: 1.6rem;">Page Not Found</h2>
        <p style="margin: 0; font-size: 1.1rem; opacity: 0.85; line-height: 1.5;">
            We couldn't reach the page you're looking for! Let's get you back to safety.
        </p>
        <a href="index.html" class="btn" style="margin-top: 10px;">Return Home</a>
    </div>

    <script>
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        
        function updateTheme(isDark) {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }

        updateTheme(prefersDark.matches);
        prefersDark.addEventListener('change', (e) => updateTheme(e.matches));

        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 400;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        function getParticleColor() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? 0x7c3aed : 0xa855f7;
        }

        const material = new THREE.PointsMaterial({
            size: 0.03,
            color: getParticleColor()
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            material.color.setHex(getParticleColor());
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
