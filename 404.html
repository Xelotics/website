<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Xelotics Games</title>
    <!-- Dynamic Favicon -->
    <link id="favicon" rel="icon" type="image/png" href="favicon-dark.png">
    <!-- Google Fonts for Rubik and Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #a855f7;
            --box-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --accent-color: #7c3aed;
            --box-bg: rgba(0, 0, 0, 0.03);
            --border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #a855f7;
            --box-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .error-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
        }

        /* Sad Jumping Jimmy Animation */
        .jimmy-jump {
            width: 130px;
            height: 150px;
            animation: jumpAnimation 1.2s infinite ease-in-out;
        }

        @keyframes jumpAnimation {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-22px); }
        }

        .btn {
            background: var(--accent-color);
            border: none;
            color: #ffffff;
            padding: 12px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
    <!-- Three.js for WebGL Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="error-container">
        <!-- Minimalistic Sad Jimmy Jumping for Unreachable String -->
        <svg class="jimmy-jump" viewBox="0 0 130 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Unreachable String hanging from top -->
            <path d="M95 0 Q90 25 105 45" stroke="#a855f7" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
            <circle cx="105" cy="45" r="4" fill="#a855f7"/>

            <!-- Sad Floppy Ears -->
            <path d="M35 72 C20 75, 18 105, 30 110 C38 112, 40 92, 40 82 Z" fill="#D99B26"/>
            <path d="M95 72 C110 75, 112 105, 100 110 C92 112, 90 92, 90 82 Z" fill="#D99B26"/>
            
            <!-- Head -->
            <rect x="35" y="58" width="60" height="60" rx="26" fill="#F4B942"/>
            
            <!-- Snout -->
            <rect x="47" y="86" width="36" height="24" rx="12" fill="#FDE08D"/>
            
            <!-- Sad Downward Eyes -->
            <path d="M46 76 Q49 73 52 76" stroke="#1E1E24" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M78 76 Q81 73 84 76" stroke="#1E1E24" stroke-width="2.5" stroke-linecap="round"/>
            
            <!-- Nose -->
            <rect x="59" y="88" width="12" height="8" rx="4" fill="#1E1E24"/>
            
            <!-- Sad Frown -->
            <path d="M54 105 Q65 99 76 105" stroke="#1E1E24" stroke-width="2.5" stroke-linecap="round"/>
            
            <!-- Reaching Paw Up -->
            <circle cx="85" cy="52" r="8" fill="#F4B942"/>
        </svg>

        <h1 style="margin: 0; color: var(--accent-color); font-size: 2rem;">404</h1>
        <h3 style="margin: 0; font-size: 1.2rem;">Page Not Found</h3>
        <p style="margin: 0; font-size: 0.95rem; opacity: 0.8;">
            Jimmy can't reach the page you're looking for! Let's get you back to safety.
        </p>
        <a href="index.html" class="btn" style="margin-top: 10px;">Return Home</a>
    </div>

    <script>
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        
        function updateTheme(isDark) {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }

        updateTheme(prefersDark.matches);
        prefersDark.addEventListener('change', (e) => updateTheme(e.matches));

        // WebGL 3D Particle Background
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 400;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        function getParticleColor() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? 0x7c3aed : 0xa855f7;
        }

        const material = new THREE.PointsMaterial({
            size: 0.03,
            color: getParticleColor()
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            material.color.setHex(getParticleColor());
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
