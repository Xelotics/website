<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xelotics - Coming Soon</title>
    <!-- Dynamic Favicon -->
    <link id="favicon" rel="icon" href="favicon-dark.png">
    <!-- Three.js for WebGL Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
        }
        [data-theme="light"] {
            --bg-color: #f5f5f5;
            --text-color: #1a1a1a;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Adds space between your logo and the text */
        }
        img.logo {
            max-width: 280px;
            height: auto;
            background: transparent; /* Ensures no background color interferes */
        }
        .coming-soon {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 0;
        }
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 3;
            background: none;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }
        .theme-toggle:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <button class="theme-toggle" onclick="toggleTheme()">Theme</button>

    <div class="content">
        <img id="logo" src="logo-dark.png" alt="Xelotics Logo" class="logo">
        <p class="coming-soon">Coming Soon</p>
    </div>

    <script>
        const favicon = document.getElementById('favicon');
        const logo = document.getElementById('logo');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        
        function updateTheme(isDark) {
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                logo.src = 'logo-dark.png';
                favicon.href = 'favicon-dark.png';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                logo.src = 'logo-light.png';
                favicon.href = 'favicon-light.png';
            }
        }

        updateTheme(prefersDark.matches);

        prefersDark.addEventListener('change', (e) => {
            updateTheme(e.matches);
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            updateTheme(currentTheme !== 'dark');
        }

        // WebGL Particle Background
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        function getParticleColor() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? 0x333333 : 0xffffff;
        }

        const material = new THREE.PointsMaterial({
            size: 0.025,
            color: getParticleColor()
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;

        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            particlesMesh.rotation.y = elapsedTime * 0.05 + mouseX * 0.2;
            particlesMesh.rotation.x = -mouseY * 0.2;
            material.color.setHex(getParticleColor());

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
